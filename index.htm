<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Angular Project</title>
    <script src="node_modules/angular/angular.js"></script>
    <script src="app.js"></script>
</head>
<body >
    <div ng-controller="collegecontroller">
        <h2>welcome to  {{collegecontroller}}</h2>
        <hr>
        <div ng-controller="studentcontroller">
            <h2>student registration</h2>
            <label> student name:</label>
            <input type="text" ng-model="name">
            <br><br>
            <label>department</label>
            <input type="text" ng-model="department">
            <br><br>
            <label>semester</label>
            <input type="text" ng-model="semester">
            <br><br>
            <label>usn</label>
            <input type="text" ng-model="USN">
            <hr>
            <button ng-click="addstudents()"></button>
            <button ng-click="addUSN()"></button>
            <h3>student deatils</h3>
            <p>name:{{name}}</p>
            <p>department:{{department}}</p>
            <p>semester:{{semester}}</p>
            <p>usn:{{USN}}</p>
            <h2>student details</h2>
            <ul>
                <li ng-repeat="student in students">{{student}}</li>
            </ul>
            <ul>
                <li ng-repeat="usn in USN">{{usn}}</li>
            </ul>
        </div>
    </div>
</body>
</html>
